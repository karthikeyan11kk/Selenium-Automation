# Jira workflow transition NAMES (not IDs) used to update the Jira test
# issue's own status on pass/fail - these are placeholders, they must match
# real transition names in YOUR Jira project's workflow exactly (case
# doesn't matter, but the name must exist). To see your actual transition
# names: open the test issue in Jira, click the status dropdown, or call
# JiraIntegration.listTransitions("PVII-31893") from a scratch test and
# print the result - it returns every transition available from the
# issue's current status, with their exact names.

JiraPassTransitionName=Done
JiraFailTransitionName=Failed

# Xray Test Run status (the "Execution Status" field with colored PASS/FAIL
# squares in the Xray Test Run view - a DIFFERENT thing from the Jira issue
# workflow status above). PASSED/FAILED are Xray Cloud's standard built-in
# statuses - only change these if your project uses custom Xray statuses.

XrayPassStatus=PASSED
XrayFailStatus=FAILED

# Custom trust store for corporate proxy/firewall SSL inspection. Leave
# blank/unset to use the JVM's own default trust store (most environments).
# Only set this if Jira/Xray calls fail with a PKIX/certificate_unknown
# error - see the comment on Hooks.configureCustomTrustStoreIfSet() for how
# to generate the keystore file.
#customTrustStorePath=C:\\path\\to\\customtruststore.jks
#customTrustStorePassword=changeit

# ---------------------------------------------------------------------------
# Feature 5: email the final execution report via Outlook once the whole
# suite finishes. Leave mailTo blank/unset to skip emailing entirely -
# everything else still runs normally.
#
# "Sending via Outlook" means going through Outlook/Office365's own SMTP
# relay (smtp.office365.com) - there's no headless/CI-safe way to drive the
# Outlook desktop app's own Send button directly. smtpHost/smtpPort below
# already default to Outlook/Office365 if left blank, so you only need to
# fill in smtpUsername/smtpPassword/mailFrom/mailTo (and mailCC, optional).
# smtpPassword must be an Outlook/Office365 App Password if the account has
# MFA enabled (same restriction Gmail has for SMTP App Passwords).
#
# mailTo / mailCC both support multiple addresses, comma-separated.
mailProvider=Outlook
mailTo=
mailCC=
smtpHost=smtp.office365.com
smtpPort=587
smtpUsername=
smtpPassword=
mailFrom=
mailSubject=Automation Test Execution Report

# Root folder for all screenshots (one subfolder per TestCaseName_Timestamp
# created underneath it). Leave commented to use <project root>/Screenshots.
#screenshotsRootDir=C:\\path\\to\\your\\Screenshots

# ---------------------------------------------------------------------------
# Feature 1: the local "upload your TestData file" web UI (utils.TestDataUploadServer)
# run before "mvn test" in the pipeline - see README.md "Feature 1" section.
uploadServerPort=9090
uploadServerTimeoutMinutes=15

# ---------------------------------------------------------------------------
# Feature 2: after the suite finishes, utils.ExecutionPackager always builds
# Testresults/ExecutionPackage_<timestamp>.zip (per-test-case screenshot +
# report folders, the overall Extent report, and the per-test-case Excel
# summary) automatically - no flag needed to produce it. Set this to Yes only
# for a local/dev run where you want that zip's folder to pop open on your
# own desktop as soon as it's ready (ignored/no-op on a headless CI agent).
autoOpenReportZip=No