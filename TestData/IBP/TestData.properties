# Jira workflow transition NAMES (not IDs) used to update the Jira test
# issue's own status on pass/fail - these are placeholders, they must match
# real transition names in YOUR Jira project's workflow exactly (case
# doesn't matter, but the name must exist). To see your actual transition
# names: open the test issue in Jira, click the status dropdown, or call
# JiraIntegration.listTransitions("PVII-31893") from a scratch test and
# print the result - it returns every transition available from the
# issue's current status, with their exact names.

JiraPassTransitionName=Done
JiraFailTransitionName=Failed

# Xray Test Run status (the "Execution Status" field with colored PASS/FAIL
# squares in the Xray Test Run view - a DIFFERENT thing from the Jira issue
# workflow status above). PASSED/FAILED are Xray Cloud's standard built-in
# statuses - only change these if your project uses custom Xray statuses.

XrayPassStatus=PASSED
XrayFailStatus=FAILED

